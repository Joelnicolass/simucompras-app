include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - riverpod_lint
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # freezed + json_serializable: @JsonSerializable/@JsonKey van sobre el
    # constructor factory; el analyzer no lo sabe (fix oficial de freezed).
    invalid_annotation_target: ignore

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: true
